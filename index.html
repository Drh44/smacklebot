<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smacklebot — PC Knowledge Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --user-msg: #2563eb;
      --bot-msg: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      height: 100dvh;
    }
    .app {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--card);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
    }
    header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: var(--user-msg);
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: var(--bot-msg);
      border-bottom-left-radius: 4px;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
      background: #0f172a;
      color: #fbbf24;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Smacklebot</h1>
      <p>Answers strictly from my verified PC notes. Missing questions get sent to me to review.</p>
    </header>
    <div id="messages">
      <div class="msg bot">Hey! Ask me any PC build, hardware, or troubleshooting question. If it's not in my notes yet, I'll ping my creator to add it.</div>
    </div>
    <form id="chat-form">
      <input id="question" type="text" placeholder="Ask a PC question..." required autocomplete="off" />
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const WORKER_URL = "https://workers.dev";

    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");
    const sendBtn = document.getElementById("send-btn");

    function addMessage(text, sender, isMissing = false) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      if (isMissing) {
        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = "Sent to creator for review";
        div.appendChild(badge);
        div.appendChild(document.createElement("br"));
      }
      div.appendChild(document.createTextNode(text));
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      addMessage(q, "user");
      input.value = "";
      sendBtn.disabled = true;

      const loading = addMessage("Checking notes...", "bot");

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q })
        });
        const data = await res.json();
        loading.remove();

        if (!res.ok) {
          addMessage(`Error: ${data.error || "Something went wrong."}`, "bot");
        } else {
          addMessage(data.answer, "bot", !data.found);
        }
      } catch (err) {
        loading.remove();
        addMessage("Network error reaching the bot server.", "bot");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
